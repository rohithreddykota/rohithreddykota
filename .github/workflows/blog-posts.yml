name: Latest writing

on:
  schedule:
    - cron: "0 6 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://rohithreddykota.com/rss.xml"
          max_post_count: 5
          template: "- [$title]($url)$newline"
          commit_message: "Update latest writing - [Skip GitHub Action]"
