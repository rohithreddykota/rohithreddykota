<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="stack-t stack-d">
  <title id="stack-t">Stack</title>
  <desc id="stack-d">Databases &amp; OLAP: ClickHouse, Apache Druid, DuckDB, Snowflake, Postgres, Iceberg, Delta Lake, MotherDuck. Streaming &amp; batch: Kafka, Apache Beam, Dataflow, Flink, Spark, Airflow, dbt. Infrastructure: Kubernetes, Helm, Terraform, Go operators, Docker, GitOps, GitHub Actions. Languages &amp; APIs: Go, Python, SQL, Scala, FastAPI, gRPC, REST. Cloud &amp; identity: Google Cloud, AWS, SSO, SAML, OIDC, IAM, Row-level security. AI tooling: MCP, Claude Code, Cursor, Codex, LLM agents, Structured outputs</desc>
